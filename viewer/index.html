<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>元素沙盒 · 3D 场景查看器</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0d14;
        color: #dfe4ec;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        overflow: hidden;
      }
      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        width: 250px;
        background: rgba(22, 27, 38, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 14px;
      }
      h1 { font-size: 14px; margin-bottom: 12px; }
      .vi { width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; }
      h1 .beta {
        font-size: 10px;
        color: #7ec8ff;
        border: 1px solid #7ec8ff;
        border-radius: 4px;
        padding: 1px 4px;
        margin-left: 4px;
        vertical-align: middle;
      }
      .file-btn, #btn-sample {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #dfe4ec;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      .file-btn:hover, #btn-sample:hover { background: rgba(255, 255, 255, 0.12); }
      .file-btn input { display: none; }
      .ctl { margin: 10px 0; font-size: 12px; color: #9aa3b2; }
      .ctl input[type='range'] { width: 100%; margin-top: 4px; }
      .ctl input[type='checkbox'] { vertical-align: middle; margin-right: 6px; }
      .stats {
        font-size: 12px;
        color: #9aa3b2;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 10px;
        line-height: 1.8;
      }
      .stats b { color: #ffd66e; font-weight: 600; }
      .hint { font-size: 11px; color: #79839a; margin-top: 8px; }
      #stage { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel">
      <h1><svg class="vi" viewBox="0 0 32 32" fill="none" aria-hidden="true"><g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M16 3.5 L28 10 V22 L16 28.5 L4 22 V10 Z"/><path d="M4 10 L16 16.5 L28 10"/><path d="M16 16.5 V28.5"/></g><g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" opacity=".85"><path d="M10 6.8 L22 13.2"/><path d="M22 13.2 V25"/></g></svg>元素沙盒 · 3D 场景查看器<span class="beta">测试版</span></h1>
      <label class="file-btn"><svg class="vi" viewBox="0 0 32 32" fill="none" aria-hidden="true"><g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M3.5 8 H12 L14.5 11 H28.5 V25.5 H3.5 Z"/></g><g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" opacity=".85"><path d="M3.5 15 H28.5"/></g></svg>加载快照 JSON<input type="file" id="file-input" accept=".json,application/json" /></label>
      <button id="btn-sample"><svg class="vi" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 26 L13 9 L20 19 L23 15 L28 26 Z" fill="#8A939D"/><path d="M13 9 L16 14 L10 14 Z" fill="#E0431A"/><path d="M16.5 24 H26" stroke="#E0431A" stroke-width="2" stroke-linecap="round" fill="none"/></svg>加载示例火山快照</button>
      <div class="ctl">
        <label>切片厚度（底部延伸成基座）：<span id="thick-val">1</span></label>
        <input type="range" id="thickness" min="1" max="12" value="1" />
      </div>
      <div class="ctl">
        <label><input type="checkbox" id="downsample" /> 降采样（2×2 格合并，性能优先）</label>
      </div>
      <div class="stats">
        实例数：<b id="inst-count">-</b><br />
        帧率：<b id="fps">-</b> FPS
      </div>
      <div class="hint">左键旋转 · 滚轮缩放 · 右键平移</div>
    </div>
    <script src="./node_modules/three/build/three.min.js"></script>
    <script src="./node_modules/three/examples/js/controls/OrbitControls.js"></script>
    <script src="./samples/volcano.js"></script>
    <script src="./viewer.js"></script>
  </body>
</html>
